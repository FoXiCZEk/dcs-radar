name: Mirror to GitLab

on:
  push:
    branches:
      - '**'
    tags:
      - '**'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Ensure GitLab project exists
        env:
          GITLAB_USER: "foxiczek1"
          GITLAB_HOST: "gitlab.docker.foxiczek.cz"
          GITLAB_TOKEN: "glpat-w0Kb6OgyOJNKL5VVTepBCG86MQp1OjUH.01.0w00191hx"
          REPO_NAME: ${{ github.event.repository.name }}
        run: |
          USER_DATA=$(curl --silent --fail --header "PRIVATE-TOKEN: $GITLAB_TOKEN" \
            "https://$GITLAB_HOST/api/v4/user")

          USER_ID=$(echo "$USER_DATA" | jq -r '.id')
          NAMESPACE_ID=$(echo "$USER_DATA" | jq -r '.username')

          # Kontrola, zda projekt jiz neexistuje
          HTTP_STATUS=$(curl --silent --output /dev/null --write-out "%{http_code}" \
            --header "PRIVATE-TOKEN: $GITLAB_TOKEN" \
            "https://$GITLAB_HOST/api/v4/projects/$NAMESPACE_ID%2F$REPO_NAME")

          if [ "$HTTP_STATUS" -eq 404 ]; then
            echo "Repozitory neexistuje. Vytvarim $REPO_NAME na GitLabu..."
            curl --silent --fail --request POST \
              --header "PRIVATE-TOKEN: $GITLAB_TOKEN" \
              --header "Content-Type: application/json" \
              --data "{\"name\": \"$REPO_NAME\", \"visibility\": \"private\"}" \
              "https://$GITLAB_HOST/api/v4/projects"
            echo "Projekt uspesne vytvoren."
          else
            echo "Projekt jiz na GitLabu existuje (HTTP $HTTP_STATUS), pokrauji v synchronizaci."
          fi

      - name: Push to GitLab
        env:
          GITLAB_HOST: "gitlab.docker.foxiczek.cz"
          GITLAB_USER: "foxiczek1"
          GITLAB_TOKEN: "glpat-w0Kb6OgyOJNKL5VVTepBCG86MQp1OjUH.01.0w00191hx"
          REPO_NAME: ${{ github.event.repository.name }}
        run: |
          git remote add gitlab "https://${GITLAB_USER}:${GITLAB_TOKEN}@${GITLAB_HOST}/${GITLAB_USER}/${REPO_NAME}.git"
          git push --prune gitlab '+refs/remotes/origin/*:refs/heads/*'
          git push --tags gitlab
