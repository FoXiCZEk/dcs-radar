# DCS Radar - Konfigurace aplikace
# Výchozí konfigurace pro lokální i produkční nasazení

server:
  host: "0.0.0.0"
  port: 8080
  allowed_origins:
    - "*"
  auth_enabled: false
  auth_token: ""

telemetry:
  # Typ zdroje telemetrie: "simulator", "tcp" nebo "file"
  type: "simulator"

  # Nastavení přímého TCP spojení s Tacview exporterem (DCS World)
  tcp:
    host: "127.0.0.1"
    port: 42674
    password: ""
    client_name: "DCS-Radar"
    reconnect_interval_sec: 5
    timeout_sec: 10

  # Nastavení průběžného sledování souboru ACMI (.txt.acmi)
  file:
    path: "./data/tacview/active.txt.acmi"
    directory: "./data/tacview"
    auto_detect_latest: true
    poll_interval_ms: 250

  # Nastavení interního realistického simulátoru (Kavkaz)
  simulator:
    update_rate_hz: 5.0
    scenario: "caucasus_dogfight"

history:
  # Retence historie v minutách (výchozí 60 minut)
  retention_minutes: 60
  # Cesta k databázi SQLite
  db_path: "./data/history.db"
  # Interval automatického úklidu historie v sekundách
  cleanup_interval_sec: 60
  # Maximální počet bodů trajektorie na objekt v paměti
  trail_max_points: 120

map:
  # Výchozí geografické zaměření (oblast Kavkaz / Černé moře)
  default_lat: 42.15
  default_lon: 41.80
  default_zoom: 8.5
  # Volitelné mapové podklady (bezklíčové CartoDB Dark Matter nebo OSM)
  tile_url: "https://cartodb-basemaps-a.global.ssl.fastly.net/dark_all/{z}/{x}/{y}.png"
  attribution: "© OpenStreetMap přispěvatelé, © CARTO"
  # Volitelný Cesium Ion token pro 3D terén (nepovinné)
  cesium_ion_token: ""
  # Jednotky výšky: "m" (metry) nebo "ft" (stopy)
  altitude_unit: "m"
  # Jednotky rychlosti: "kts" (uzly) nebo "kmh" (km/h)
  speed_unit: "kts"
  # Jazyk rozhraní
  language: "cs"

logging:
  level: "info"
  format: "console"
